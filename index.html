<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" />
    <meta name="description" content="Interactive explorer for The Update Framework specification: toggle TAPs and see constraint changes, security impacts, and implementation coverage in real time." />
    <meta property="og:title" content="TUF Spec Explorer" />
    <meta property="og:description" content="Interactive explorer for The Update Framework Augmentation Proposals (TAPs)." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kipz.github.io/tuf-spec-explorer/" />
    <meta name="twitter:card" content="summary" />
    <title>TUF Spec Explorer</title>
    <style>
      html { background: #f8f9fc; color-scheme: light; }
      html[data-theme="dark"] { background: #0f1117; color-scheme: dark; }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
